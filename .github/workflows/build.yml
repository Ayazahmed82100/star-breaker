name: Build Android APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install packages
        run: npm install

      - name: Bundle the ads code
        run: npx esbuild src/ads.js --bundle --minify --format=iife --outfile=www/ads.js

      - name: Add Android platform
        run: npx cap add android

      - name: Set AdMob App ID in the Android manifest
        run: |
          python3 - <<'PY'
          p = 'android/app/src/main/AndroidManifest.xml'
          s = open(p, encoding='utf-8').read()
          meta = '<meta-data android:name="com.google.android.gms.ads.APPLICATION_ID" android:value="ca-app-pub-4491823835774613~5784211037"/>'
          assert '</application>' in s
          s = s.replace('</application>', '    ' + meta + '\n    </application>')
          open(p, 'w', encoding='utf-8').write(s)
          print('AdMob App ID added to manifest')
          PY

      - name: Sync game files
        run: npx cap sync android

      - name: Build debug APK
        run: cd android && chmod +x gradlew && ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: star-breaker-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
